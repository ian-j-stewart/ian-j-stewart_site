media:
  input: public/assets
  output: /assets

content:
  - name: settings
    label: Site settings
    type: file
    path: src/content/settings/site.yml
    format: yaml
    fields:
      - name: siteTitle
        label: Site title
        type: string
      - name: siteDescription
        label: Default meta description
        type: text
      - name: siteUrl
        label: Site URL
        type: string
      - name: defaultImage
        label: Default social image
        type: image
      - name: author
        label: Author name
        type: string
      - name: institution
        label: Current institution
        type: object
        fields:
          - name: title
            label: Job title
            type: string
          - name: name
            label: Institution name
            type: string
          - name: url
            label: Institutional profile URL
            type: string
      - name: contact
        label: Contact
        type: object
        fields:
          - name: academicEmail
            label: Academic contact email
            type: string
          - name: advisoryEmail
            label: Advisory contact email
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
      - name: social
        label: Social links
        type: object
        list: true
        fields:
          - name: platform
            type: string
          - name: url
            type: string
      - name: navigation
        label: Primary navigation
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: href
            type: string
      - name: person
        label: Person profiles
        type: object
        fields:
          - name: orcid
            label: ORCID URL
            type: string
          - name: googleScholar
            label: Google Scholar URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: cns
            label: CNS expert page URL
            type: string
          - name: fusionlabs
            label: FusionLabs URL
            type: string
          - name: nonproarchive
            label: Nonproliferation Archive URL
            type: string
      - name: footer
        label: Footer
        type: object
        fields:
          - name: text
            type: text
          - name: copyright
            type: string
      - name: featured
        label: Featured homepage items
        type: object
        fields:
          - name: publication
            label: Featured publication ID
            type: string
          - name: project
            label: Featured research item ID
            type: string
          - name: essay
            label: Featured essay ID
            type: string
      - name: analytics
        label: Analytics
        type: object
        fields:
          - name: cloudflareToken
            label: Cloudflare Web Analytics token
            type: string

  - name: homepage
    label: Homepage
    type: file
    path: src/content/pages/home.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Page title
        type: string
      - name: description
        label: Meta description
        type: text
      - name: heading
        label: Hero heading
        type: string
      - name: eyebrow
        label: Hero eyebrow
        type: string
      - name: descriptor
        label: Hero descriptor
        type: string
      - name: intro
        label: Hero introductory statement
        type: text
      - name: primaryButton
        label: Primary CTA
        type: object
        fields:
          - name: label
            type: string
          - name: href
            type: string
      - name: secondaryButton
        label: Secondary CTA
        type: object
        fields:
          - name: label
            type: string
          - name: href
            type: string
      - name: ogImage
        label: Social image
        type: image
    body:
      label: About section

  - name: researchPage
    label: Research page
    type: file
    path: src/content/pages/research.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: heading
        type: string
      - name: ogImage
        type: image
    body:
      label: Opening copy

  - name: engagementPage
    label: Engagement page
    type: file
    path: src/content/pages/engagement.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: heading
        type: string
      - name: ogImage
        type: image
    body:
      label: Opening copy

  - name: aboutPage
    label: About page
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        type: string
      - name: description
        type: text
      - name: heading
        type: string
      - name: ogImage
        type: image
    body:
      label: Biography

  - name: researchThemes
    label: Research themes
    type: collection
    path: src/content/research-themes
    filename: "{primary}.md"
    view:
      fields: [title, featured, draft]
      primary: title
    fields:
      - name: title
        type: string
        required: true
      - name: proposition
        label: One-sentence proposition
        type: string
      - name: summary
        label: Short summary
        type: text
      - name: questions
        label: Central research questions
        type: string
        list: true
      - name: topics
        label: Topics
        type: string
        list: true
      - name: relatedPublications
        label: Related publication IDs
        type: string
        list: true
      - name: relatedProjects
        label: Related research item IDs
        type: string
        list: true
      - name: relatedEssays
        label: Related essay IDs
        type: string
        list: true
      - name: featured
        type: boolean
      - name: draft
        type: boolean
    body:
      label: Full thematic description

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    filename: "{year}-{primary}.md"
    view:
      fields: [title, year, type, status, featured, draft]
      primary: title
    fields:
      - name: title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: authors
        label: Authors
        type: string
        list: true
      - name: editors
        label: Editors
        type: string
        list: true
      - name: ianRole
        label: Ian's role
        type: select
        options:
          - Author
          - Co-author
          - Editor
          - Co-editor
          - Contributor
          - Institutional contributor
      - name: year
        label: Year
        type: number
      - name: date
        label: Specific date
        type: date
      - name: type
        label: Publication type
        type: select
        options:
          - Monograph
          - Edited volume
          - Peer-reviewed article
          - Book chapter
          - Major report
          - Policy paper
          - Professional article
          - Commentary
          - Essay
          - Institutional output
      - name: status
        label: Publication status
        type: select
        options:
          - Published
          - Forthcoming
          - Under contract
          - In development
      - name: venue
        label: Journal, venue or publisher
        type: string
      - name: publisher
        label: Publisher
        type: string
      - name: volume
        type: string
      - name: issue
        type: string
      - name: pages
        type: string
      - name: citation
        label: Suggested citation
        type: text
      - name: summary
        label: Short summary
        type: text
      - name: doi
        label: DOI
        type: string
      - name: externalUrl
        label: External URL
        type: string
      - name: publisherUrl
        label: Publisher page URL
        type: string
      - name: pdfUrl
        label: Permitted PDF URL
        type: string
      - name: cover
        label: Cover / thumbnail
        type: image
      - name: coverAlt
        label: Cover alt text
        type: string
      - name: themes
        label: Research theme IDs
        type: select
        list: true
        options:
          - label: AI, Compute and Emerging Technology
            value: ai-compute-emerging-technology
          - label: Nuclear Technology and Strategic Autonomy
            value: nuclear-technology-strategic-autonomy
          - label: Technology Control and Economic Statecraft
            value: technology-control-economic-statecraft
      - name: featuredOnThemes
        label: Feature on selected research-theme pages
        help: Use this to hand-pick publications that should appear at the top of a research-theme page. Up to eight will be shown.
        type: select
        list: true
        options:
          - label: AI, Compute and Emerging Technology
            value: ai-compute-emerging-technology
          - label: Nuclear Technology and Strategic Autonomy
            value: nuclear-technology-strategic-autonomy
          - label: Technology Control and Economic Statecraft
            value: technology-control-economic-statecraft
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: displayOnEssays
        label: Display on Essays page
        type: boolean
      - name: displayOrder
        label: Display order
        type: number
      - name: order
        label: Sort order
        type: number
      - name: draft
        type: boolean
    body:
      label: Abstract

  - name: currentResearch
    label: Current research
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    view:
      fields: [title, status, featured, draft]
      primary: title
    fields:
      - name: title
        type: string
        required: true
      - name: summary
        label: Short summary
        type: text
      - name: proposition
        label: One-sentence proposition
        type: string
      - name: status
        label: Status
        help: Choose a specific status only when it has been confirmed. 'Developing' is treated as a placeholder and is not shown on cards.
        type: select
        options:
          - Current
          - Developing
          - Completed
          - Working paper in development
          - Article project
          - Longer-term research programme
          - Book concept
          - Active institutional research
      - name: themes
        label: Research theme IDs
        type: select
        list: true
        options:
          - label: AI, Compute and Emerging Technology
            value: ai-compute-emerging-technology
          - label: Nuclear Technology and Strategic Autonomy
            value: nuclear-technology-strategic-autonomy
          - label: Technology Control and Economic Statecraft
            value: technology-control-economic-statecraft
      - name: startDate
        label: Start date
        type: date
      - name: endDate
        label: End date
        type: date
      - name: collaborators
        label: Collaborators
        type: string
        list: true
      - name: funder
        label: Funder
        type: string
      - name: outputs
        label: Outputs
        type: string
        list: true
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            type: string
          - name: href
            type: string
      - name: questions
        label: Central questions
        type: string
        list: true
      - name: relatedPublications
        label: Related publication IDs
        type: string
        list: true
      - name: relatedEssays
        label: Related essay IDs
        type: string
        list: true
      - name: featured
        type: boolean
      - name: order
        type: number
      - name: draft
        type: boolean
    body:
      label: Full description

  - name: essays
    label: Essays
    type: collection
    path: src/content/essays
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, featured, draft]
      primary: title
    fields:
      - name: title
        type: string
        required: true
      - name: date
        type: date
      - name: excerpt
        type: text
      - name: themes
        label: Research theme IDs
        type: select
        list: true
        options:
          - label: AI, Compute and Emerging Technology
            value: ai-compute-emerging-technology
          - label: Nuclear Technology and Strategic Autonomy
            value: nuclear-technology-strategic-autonomy
          - label: Technology Control and Economic Statecraft
            value: technology-control-economic-statecraft
      - name: heroImage
        label: Hero image
        type: image
      - name: heroImageAlt
        label: Hero image alt text
        type: string
      - name: externalUrl
        label: External URL (for off-site essays)
        type: string
      - name: canonicalUrl
        type: string
      - name: featured
        type: boolean
      - name: draft
        type: boolean
      - name: seoDescription
        type: text
    body:
      label: Main body
